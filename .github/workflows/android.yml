# Builds the PrepCadet TWA APK. Signed release build when the bootstrap
# workflow's output has been turned into secrets; otherwise a debug build, so
# this never fails a fork or a pre-bootstrap run for lack of signing material.
#
# WHY the runner's preinstalled SDK instead of android-actions/setup-android:
# GitHub's ubuntu-latest image ships a full Android SDK (platform-tools,
# recent platforms/build-tools, and pre-accepted licenses) out of the box —
# see actions/runner-images. That's what Gradle/AGP finds via ANDROID_HOME
# without any extra step, and it isn't a third-party action's uptime or a
# fresh multi-hundred-MB download on every run. android-actions/setup-android
# duplicates work the image already did and adds an external dependency for
# no benefit here.
name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
    # A `v*` tag is the release trigger. Pushing one builds the signed APK AND
    # publishes it as a GitHub Release — see the `release` job at the bottom.
    #
    # Tag-triggered rather than fired on every android/** commit, because a
    # release is a decision. What this closes is the gap where the only public
    # download was a Release created by hand once: CI produced an artifact that
    # expires and needs a GitHub login, the site linked to a release nobody
    # automated, and nothing anywhere noticed if the two drifted apart.
    tags:
      - "v*"
  workflow_dispatch:

# `contents: write` is needed to create a Release. It is scoped to this
# workflow, and only the release job below actually uses it.
permissions:
  contents: write

concurrency:
  # A newer push makes an in-flight build of the same ref moot; cancel it
  # instead of burning runner minutes on an APK nothing will download.
  #
  # Never cancel a tag build: that one is publishing a release, and killing it
  # half way can leave a Release created with no APK attached to it.
  group: android-build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: versionCode is the commit count, and the default
          # shallow clone would make that 1 on every single build.
          fetch-depth: 0

      # versionCode from the commit count, versionName from the tag when there
      # is one. Both are passed to Gradle rather than edited into build.gradle,
      # so the file in git never has to be kept in step with a release.
      - name: Derive version
        run: |
          set -euo pipefail
          CODE="$(git rev-list --count HEAD)"
          echo "version_code=$CODE" >> "$GITHUB_ENV"

          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            # v1.2.3 -> 1.2.3
            NAME="${GITHUB_REF_NAME#v}"
          else
            NAME="0.0.0-dev+${CODE}"
          fi
          echo "version_name=$NAME" >> "$GITHUB_ENV"
          echo "Building versionCode=$CODE versionName=$NAME"

      # The wrapper jar is a BINARY committed to a public repo, and a tampered
      # one runs arbitrary code with the build's privileges before any of our
      # own gradle files are read. Gradle publishes known-good checksums for
      # every release; this checks against them on every run rather than
      # trusting the one-off verification done when the file was added.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          # Keys the cache on the wrapper + build files under android/, so it
          # warms up on the very first run this trigger fires for.
          cache: gradle

      # Defensive, not load-bearing: the image's preinstalled SDK components
      # already have their licenses accepted. This only matters if AGP's
      # compileSdk needs to auto-download something the image didn't ship,
      # and is a no-op (not a failure) when sdkmanager isn't where expected.
      - name: Accept any outstanding Android SDK licenses
        continue-on-error: true
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ] && [ -n "${ANDROID_HOME:-}" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager 2>/dev/null | sort -V | tail -n1)"
          fi
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          fi

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # Gated on ANDROID_KEYSTORE_BASE64 alone, per the bootstrap workflow's
      # instructions to create all four secrets together. Decoding happens
      # here (not inline in the build step) so a bad/missing secret shows up
      # as a clear step failure rather than a confusing Gradle error.
      - name: Decode release keystore if configured
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_BASE64" ]; then
            KEYSTORE_PATH="$GITHUB_WORKSPACE/android/app/release.keystore"
            echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
            echo "signed=true" >> "$GITHUB_ENV"
            # Absolute path so it resolves the same way regardless of whether
            # build.gradle treats KEYSTORE_FILE as relative to the app module
            # or to the Gradle root — we don't control that file here.
            echo "KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          else
            echo "signed=false" >> "$GITHUB_ENV"
          fi

      # A tag means a public download. An unsigned debug APK cannot be one:
      # it is signed with the throwaway debug key, so it will not verify
      # against the Digital Asset Links fingerprint and will not upgrade over
      # an installed release. Better to fail the release loudly here than to
      # publish something that installs and then misbehaves.
      - name: Refuse to release without signing material
        if: github.ref_type == 'tag' && env.signed != 'true'
        run: |
          echo "::error::Tag ${{ github.ref_name }} cannot be released: the ANDROID_KEYSTORE_* secrets are not configured, so only a debug APK can be built."
          exit 1

      - name: Assemble release APK (signed)
        if: env.signed == 'true'
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -PversionCode=${{ env.version_code }} \
            -PversionName=${{ env.version_name }}

      - name: Assemble debug APK (signing secrets not configured yet)
        if: env.signed != 'true'
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace \
            -PversionCode=${{ env.version_code }} \
            -PversionName=${{ env.version_name }}

      - name: Record which variant this run built
        run: |
          if [ "$signed" = "true" ]; then
            echo "apk_variant=release" >> "$GITHUB_ENV"
          else
            echo "apk_variant=debug" >> "$GITHUB_ENV"
          fi

      # Globbed rather than a hardcoded filename: applicationId/versionName
      # can end up in the APK's name, and that's the other agent's territory,
      # not something this workflow should have to track.
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: prepcadet-${{ env.apk_variant }}-run${{ github.run_number }}
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      # ── release ──────────────────────────────────────────────────────────
      #
      # Only on a tag. The asset MUST be named cds-prep.apk: prepcadet.in
      # /download/android redirects to
      # releases/latest/download/cds-prep.apk, and that URL is resolved by
      # asset name. Rename it here and the site keeps working; rename it
      # anywhere else and the download 404s with nothing to say so.
      # See src/app/download/android/route.ts.
      - name: Stage the release asset
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk -name '*.apk' | head -n1)"
          if [ -z "$APK" ]; then
            echo "::error::No APK produced."; exit 1
          fi
          mkdir -p release
          cp "$APK" release/cds-prep.apk
          echo "Staged $APK as cds-prep.apk"
          sha256sum release/cds-prep.apk | tee release/cds-prep.apk.sha256

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/cds-prep.apk
            release/cds-prep.apk.sha256
          # Not a prerelease and not a draft: `releases/latest` — which is what
          # the site links to — skips both, so either one would publish a
          # release the download button cannot see.
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            PrepCadet Android (Trusted Web Activity over prepcadet.in)

            - versionName `${{ env.version_name }}`
            - versionCode `${{ env.version_code }}`

            Install: <https://prepcadet.in/download/android>

            Verify the download:
            ```
            sha256sum -c cds-prep.apk.sha256
            ```
