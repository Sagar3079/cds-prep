# Builds the PrepCadet TWA APK. Signed release build when the bootstrap
# workflow's output has been turned into secrets; otherwise a debug build, so
# this never fails a fork or a pre-bootstrap run for lack of signing material.
#
# WHY the runner's preinstalled SDK instead of android-actions/setup-android:
# GitHub's ubuntu-latest image ships a full Android SDK (platform-tools,
# recent platforms/build-tools, and pre-accepted licenses) out of the box —
# see actions/runner-images. That's what Gradle/AGP finds via ANDROID_HOME
# without any extra step, and it isn't a third-party action's uptime or a
# fresh multi-hundred-MB download on every run. android-actions/setup-android
# duplicates work the image already did and adds an external dependency for
# no benefit here.
name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push makes an in-flight build of the same ref moot; cancel it
  # instead of burning runner minutes on an APK nothing will download.
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The wrapper jar is a BINARY committed to a public repo, and a tampered
      # one runs arbitrary code with the build's privileges before any of our
      # own gradle files are read. Gradle publishes known-good checksums for
      # every release; this checks against them on every run rather than
      # trusting the one-off verification done when the file was added.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          # Keys the cache on the wrapper + build files under android/, so it
          # warms up on the very first run this trigger fires for.
          cache: gradle

      # Defensive, not load-bearing: the image's preinstalled SDK components
      # already have their licenses accepted. This only matters if AGP's
      # compileSdk needs to auto-download something the image didn't ship,
      # and is a no-op (not a failure) when sdkmanager isn't where expected.
      - name: Accept any outstanding Android SDK licenses
        continue-on-error: true
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ] && [ -n "${ANDROID_HOME:-}" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager 2>/dev/null | sort -V | tail -n1)"
          fi
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          fi

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # Gated on ANDROID_KEYSTORE_BASE64 alone, per the bootstrap workflow's
      # instructions to create all four secrets together. Decoding happens
      # here (not inline in the build step) so a bad/missing secret shows up
      # as a clear step failure rather than a confusing Gradle error.
      - name: Decode release keystore if configured
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_BASE64" ]; then
            KEYSTORE_PATH="$GITHUB_WORKSPACE/android/app/release.keystore"
            echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
            echo "signed=true" >> "$GITHUB_ENV"
            # Absolute path so it resolves the same way regardless of whether
            # build.gradle treats KEYSTORE_FILE as relative to the app module
            # or to the Gradle root — we don't control that file here.
            echo "KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          else
            echo "signed=false" >> "$GITHUB_ENV"
          fi

      - name: Assemble release APK (signed)
        if: env.signed == 'true'
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Assemble debug APK (signing secrets not configured yet)
        if: env.signed != 'true'
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Record which variant this run built
        run: |
          if [ "$signed" = "true" ]; then
            echo "apk_variant=release" >> "$GITHUB_ENV"
          else
            echo "apk_variant=debug" >> "$GITHUB_ENV"
          fi

      # Globbed rather than a hardcoded filename: applicationId/versionName
      # can end up in the APK's name, and that's the other agent's territory,
      # not something this workflow should have to track.
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: prepcadet-${{ env.apk_variant }}-run${{ github.run_number }}
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
