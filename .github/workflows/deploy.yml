# Ships main to the VPS behind prepcadet.in.
#
# The workflow does not build, test or copy anything. It opens one SSH
# connection, and the key it uses is pinned to a forced command in the server's
# authorized_keys — so this job CANNOT run an arbitrary command on the box even
# if the secret leaks. It can trigger a deploy. That is all it can do.
#
# The build, the health check and the rollback all live in /opt/cds-prep/deploy.sh
# on the server, where they can see whether the site actually came back up.
name: Deploy to prepcadet.in

on:
  push:
    branches: [main]
  workflow_dispatch: # so a deploy can be re-run without an empty commit

concurrency:
  # Two deploys at once would fight over the same working tree and the same
  # systemd unit. Never cancel one in flight — it may be mid-rollback.
  group: vps-deploy
  cancel-in-progress: false

jobs:
  # The gate that was missing.
  #
  # Every command below already existed and was already good; none of them ran
  # anywhere before a push reached production, so the VPS was the first machine
  # that ever tried to build a commit. `deploy.sh` rolls a bad build back
  # correctly, but rolling back is a worse outcome than not shipping — and a
  # rollback still costs a restart on a live site.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22 rather than 20: scripts/daily-snapshot.mjs imports
          # src/lib/daily.ts directly and relies on Node's type stripping,
          # which landed in 22.18.
          node-version: "22"
          cache: npm
      - run: npm ci

      # Build FIRST, and the order is load-bearing rather than stylistic.
      #
      # Next generates the global route types — `LayoutProps`, `PageProps` — into
      # .next/types during the build, and tsconfig.json includes them. On a clean
      # checkout they do not exist yet, so `tsc --noEmit` before a build fails
      # with four "Cannot find name 'LayoutProps'" errors in the route layouts.
      #
      # Nobody had seen that, because typecheck had never run anywhere without a
      # .next already sitting there from earlier work. The first CI run this
      # workflow ever performed found it immediately. CLAUDE.md's own completion
      # checklist already puts build ahead of typecheck; this now matches.
      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # The daily set must not move. Appending one question to the English bank
      # reshuffles every window and silently hands every existing user a
      # different test — no type breaks and no test fails when that happens, so
      # this is the only thing watching for it.
      - name: Daily-set determinism
        run: node scripts/daily-snapshot.mjs --proof

      # Marketing copy checked against the real bank, so the landing page cannot
      # claim a question count the data does not support.
      - name: Landing facts
        run: npm run landing:facts

      # `npm run visual` is deliberately NOT here: it drives Playwright against
      # a running dev server and is the one check in this repo that needs a
      # browser and a warm app. Run it locally when touching a viewport-
      # dependent layout, as CLAUDE.md says.

  deploy:
    # Nothing reaches the VPS until the above is green.
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Trigger deploy over SSH
        env:
          KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          # Trust on first use is acceptable here only because the key is
          # command-restricted: the worst a spoofed host learns is that a
          # deploy was requested.
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          # The remote command is ignored — authorized_keys forces deploy.sh.
          # Its exit code is the job's: a failed build or a failed health check
          # rolls back on the server AND fails here, so the red tick is honest.
          ssh -i ~/.ssh/deploy -o BatchMode=yes -o ConnectTimeout=30 \
              "$USER@$HOST" deploy
