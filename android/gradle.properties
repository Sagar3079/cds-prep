# Default JVM heap for the Gradle daemon; TWA builds are tiny but AGP's model
# building + R8 still benefit from headroom on shared CI runners.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Required by AGP: the project uses androidx.* artifacts (androidbrowserhelper
# depends on androidx.browser, androidx.core, androidx.webkit) not the old
# android.support.* ones.
android.useAndroidX=true

# Speeds up multi-module and incremental builds; harmless here with a single
# :app module but keeps this file a sane default if modules are added later.
org.gradle.parallel=true
org.gradle.caching=true

# Kept off on purpose: AndroidX "jetifier" is for legacy support-library
# dependencies, which this project has none of. Leaving it on just slows
# every build down for no benefit.
android.enableJetifier=false
