# Which blue/green slot is live. THIS FILE IS REWRITTEN BY ops/deploy.sh.
#
# Flipping traffic is a rewrite of the line below plus `nginx -s reload`, which
# is graceful: nginx starts new workers on the new config and lets the old ones
# finish the requests they are already serving. Nobody in flight is dropped.
#
#   slot a -> 127.0.0.1:3100
#   slot b -> 127.0.0.1:3101
#
# Install to /etc/nginx/conf.d/cds-prep-upstream.conf, which is included by the
# main nginx.conf's http block — the upstream must be defined at http level, so
# it cannot live inside the server block in sites-available/prepcadet.in.
#
# Edit by hand only to force traffic back to a known-good slot in an emergency:
#   sed -i 's/:310[01]/:3100/' /etc/nginx/conf.d/cds-prep-upstream.conf
#   nginx -t && systemctl reload nginx

upstream cds_prep {
    server 127.0.0.1:3100;
    keepalive 16;
}
